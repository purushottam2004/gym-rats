name: Deploy database and Edge Functions to production

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-cd.yaml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: main

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      # Pin the CLI so setup does not call the GitHub releases API for "latest"
      # (that lookup is what failed deploy with "rate limit exceeded").
      - uses: supabase/setup-cli@v3
        with:
          version: 3.4.0

      - run: supabase link --project-ref $SUPABASE_PROJECT_ID
        working-directory: supabase
      - run: supabase db push --remote --yes
        working-directory: supabase
      - run: supabase functions deploy --yes
        working-directory: supabase
